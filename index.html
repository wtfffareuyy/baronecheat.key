<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcone Cheat - Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background-color: #0d0d0d;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Effetto griglia di sfondo */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .container {
            background-color: #121212;
            border: 2px solid #00ff00;
            padding: 40px;
            border-radius: 0; /* Tutto quadrato */
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
        }

        p {
            color: #888;
            font-size: 12px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            background-color: #000;
            border: 1px solid #333;
            color: #00ff00;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #00ff00;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #00ff00;
            color: #000;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #00cc00;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        .success { color: #00ff00; }
        .error { color: #ff3333; }
        .loading { color: #ffff00; }

        /* Area download (nascosta di default) */
        #download-area {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #333;
        }

        .btn-download {
            display: inline-block;
            padding: 12px 24px;
            background-color: #000;
            color: #00ff00;
            text-decoration: none;
            border: 1px solid #00ff00;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-download:hover {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Barcone Cheat</h1>
        <p>Enter your key to unlock the script</p>

        <div class="input-group">
            <input type="text" id="keyInput" placeholder="Inserisci la Key...">
        </div>

        <button id="verifyBtn" onclick="checkKey()">Verifica Key</button>
        
        <div id="status"></div>

        <div id="download-area">
            <p style="color: #00ff00; margin-bottom: 15px;">Key Valida! Il tuo accesso è sbloccato.</p>
            <!-- SOSTITUISCI QUESTO LINK CON IL LINK RAW DEL TUO SCRIPT DA GITHUB -->
            <a href="https://raw.githubusercontent.com/TUONOME/TUOREPO/main/script.lua" target="_blank" class="btn-download">Scarica lo Script</a>
            <p style="margin-top: 10px; font-size: 10px;">(Il link è protetto. Copia il codice nell'executor)</p>
        </div>
    </div>

    <script>
        const firebaseUrl = "https://baronecheats-default-rtdb.europe-west1.firebasedatabase.app/keys.json";

        async function checkKey() {
            const key = document.getElementById('keyInput').value.trim();
            const status = document.getElementById('status');
            const downloadArea = document.getElementById('download-area');
            const btn = document.getElementById('verifyBtn');

            // Reset
            downloadArea.style.display = 'none';
            status.className = 'loading';
            status.innerText = "Connessione al database in corso...";
            btn.disabled = true;

            if (key === "") {
                status.className = 'error';
                status.innerText = "Inserisci una chiave valida.";
                btn.disabled = false;
                return;
            }

            try {
                // Richiesta a Firebase
                const response = await fetch(firebaseUrl);
                
                if (!response.ok) {
                    throw new Error("Errore di rete");
                }

                const data = await response.json();

                // Controllo se la chiave esiste nel database
                if (data && data[key] === true) {
                    // KEY VALIDA
                    status.className = 'success';
                    status.innerText = "✅ Accesso Consentito.";
                    
                    // Mostra il bottone di download
                    downloadArea.style.display = 'block';
                } else {
                    // KEY NON VALIDA
                    status.className = 'error';
                    status.innerText = "❌ Key non valida o scaduta.";
                }

            } catch (error) {
                status.className = 'error';
                status.innerText = "⚠ Errore di connessione al server.";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        // Permette di premere "Invio" per verificare
        document.getElementById('keyInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkKey();
            }
        });
    </script>
</body>
</html>
